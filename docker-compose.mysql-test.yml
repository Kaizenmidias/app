services:
  mysql-test:
    image: mysql:8.4
    container_name: kaizen-mysql-test
    environment:
      MYSQL_DATABASE: kaizen_partners_test
      MYSQL_USER: kaizen_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?MYSQL_TEST_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?MYSQL_TEST_ROOT_PASSWORD is required}
    ports:
      - 127.0.0.1:13306:3306
    volumes:
      - kaizen_mysql_test_data:/var/lib/mysql
    networks: [kaizen_mysql_test]
    mem_limit: 1g
    cpus: 1.0
networks:
  kaizen_mysql_test:
    name: kaizen_mysql_test
volumes:
  kaizen_mysql_test_data:
